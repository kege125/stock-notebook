<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101115"><title>股票交易记录</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#101115;color:#f4f5f8}*{box-sizing:border-box}body{margin:0;background:#101115;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}.top,.head,.stocktop,.detailtop{display:flex;justify-content:space-between;align-items:center}.top{margin:4px 3px 19px}.top h1{font-size:26px;margin:3px 0}.sub,.hint{font-size:12px;color:#9298aa}.add,.btn{border:0;border-radius:13px;font-weight:800}.add{background:#2dd297;color:#092419;padding:11px 13px}.totals{background:linear-gradient(135deg,#252938,#17191f);border:1px solid #2d3140;border-radius:22px;padding:18px}.label{font-size:12px;color:#a7adbe}.big{font-size:30px;font-weight:850;margin:4px 0 17px}.grid3,.stockdata,.pnlgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid3{border-top:1px solid #343948;padding-top:13px}.grid3 b,.stockdata b,.pnl b{display:block;margin-top:5px;font-size:14px}.section{margin-top:25px}.head{margin:0 3px 10px}.head h2{font-size:19px;margin:0}.stock{background:#1a1c23;border:1px solid #2b2e39;border-radius:18px;padding:15px;margin:9px 0}.stock:active{background:#252833}.name{font-weight:800;font-size:17px}.qty{font-size:13px;color:#a0a6b7;margin-top:5px}.pricebox{width:112px;text-align:right}.pricebox label{display:block;font-size:11px;color:#8e95a8;margin-bottom:3px}.pricebox input{width:100%;border:0;border-radius:8px;background:#282c37;color:#fff;padding:5px 7px;text-align:right;font-size:15px}.stockdata{border-top:1px solid #2d303b;margin-top:13px;padding-top:11px}.stockdata span,.pnl span{font-size:11px;color:#9299aa}.up{color:#37d89b}.down{color:#ff6e72}.zero{color:#f5f5f7}.empty{background:#1a1c23;border:1px dashed #3a3e4b;border-radius:18px;padding:31px 16px;text-align:center;color:#9aa0af}.footer{text-align:center;margin:28px 0 3px;color:#7f8595;font-size:12px;line-height:1.6}.modal{display:none;position:fixed;z-index:10;inset:0;background:#000a;align-items:end}.modal.show{display:flex}.sheet{width:100%;max-width:680px;margin:auto;background:#181a20;border-radius:25px 25px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:93dvh;overflow:auto;overflow-x:hidden}.sheet h2{margin:0;font-size:22px}.hint{margin:5px 0 16px}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;color:#aab0c0;font-size:13px;font-weight:650;min-width:0}.form input{min-width:0;width:100%;background:#242731;border:1px solid #363a47;border-radius:10px;color:#fff;min-height:45px;padding:8px 10px;font-size:16px}.two,.actions,.tradeactions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fee{background:#212d2a;border-radius:10px;padding:11px;color:#afc7ba;font-size:13px;display:flex;justify-content:space-between;gap:8px}.fee strong{color:#40d79d;white-space:nowrap}.actions{grid-template-columns:1fr 1.4fr;margin-top:7px}.btn{min-height:48px}.cancel{background:#2a2d36;color:#d9dce5}.save{background:#2dd297;color:#092419}.close{border:0;background:#2b2e37;color:#fff;border-radius:50%;font-size:19px;width:35px;height:35px}.pnlgrid{margin:16px 0}.pnl{background:#22252e;border-radius:12px;padding:11px}.buy{background:#253c35;color:#45dca5}.sell{background:#3d2a2d;color:#ff8d8f}.tradeactions{margin:14px 0 19px}.trade{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:9px;padding:13px 0;border-top:1px solid #2b2e38}.dir{font-weight:850}.dir small,.trade small{display:block;color:#949aaa;font-weight:500;margin-top:3px;font-size:11px}.trademid{font-size:14px}.amount{text-align:right;font-weight:750}@media(max-width:430px){.two,.actions{grid-template-columns:1fr}.actions .btn{width:100%}.top h1{font-size:24px}.add{padding:10px 11px}}
</style></head><body><main class="app"><header class="top"><div><div class="sub">MY STOCK NOTE</div><h1>股票交易记录</h1></div><button id="new" class="add">＋ 首次买入</button></header><section class="totals"><div class="label">总盈亏</div><div id="total" class="big zero">¥0.00</div><div class="grid3"><div><span class="label">已实现盈亏</span><b id="realized">¥0.00</b></div><div><span class="label">未实现盈亏</span><b id="unrealized">¥0.00</b></div><div><span class="label">当前持仓</span><b id="count">0 只</b></div></div></section><section class="section"><div class="head"><h2>当前持仓</h2><span class="sub">点股票查看明细</span></div><div id="stocks"></div></section><p class="footer">手续费按成交金额万分之一自动计算。<br>数据只保存在本手机的浏览器中。</p></main>
<div id="newM" class="modal"><section class="sheet"><h2>首次买入</h2><p class="hint">以后交易只需点持仓股票，不再填写名称。</p><form id="newF" class="form"><label>股票名称<input name="name" required placeholder="例如：贵州茅台"></label><div class="two"><label>买入价格<input name="price" required type="number" min=".01" step=".01"></label><label>买入数量<input name="quantity" required type="number" min="1" step="1" value="100"></label></div><div class="two"><label>日期<input name="date" required type="date"></label><label>时间<input name="time" required type="time"></label></div><div class="fee"><span>手续费（万分之一）</span><strong id="newFee">¥0.00</strong></div><div class="actions"><button type="button" class="btn cancel" data-close="newM">取消</button><button type="submit" class="btn save">保存买入</button></div></form></section></div>
<div id="tradeM" class="modal"><section class="sheet"><h2 id="tradeTitle">记录交易</h2><p id="tradeHint" class="hint"></p><form id="tradeF" class="form"><div class="two"><label>价格<input name="price" required type="number" min=".01" step=".01"></label><label id="qLabel">数量<input name="quantity" required type="number" min="1" step="1"></label></div><div class="two"><label>日期<input name="date" required type="date"></label><label>时间<input name="time" required type="time"></label></div><div class="fee"><span>手续费（万分之一）</span><strong id="tradeFee">¥0.00</strong></div><div class="actions"><button type="button" class="btn cancel" data-close="tradeM">取消</button><button id="saveTrade" class="btn save">保存</button></div></form></section></div>
<div id="detailM" class="modal"><section class="sheet"><div class="detailtop"><div><h2 id="dName"></h2><p id="dQty" class="hint"></p></div><button class="close" data-close="detailM">×</button></div><div class="pnlgrid"><div class="pnl"><span>总盈亏</span><b id="dTotal"></b></div><div class="pnl"><span>已实现</span><b id="dReal"></b></div><div class="pnl"><span>未实现</span><b id="dUnreal"></b></div></div><div class="tradeactions"><button id="buy" class="btn buy">＋ 买入</button><button id="sell" class="btn sell">－ 卖出</button></div><div class="head"><h2 style="font-size:18px">交易明细</h2><span class="sub">先进先出</span></div><div id="list"></div></section></div>
<script>
const K='stock-fifo-v2',$=s=>document.querySelector(s),N=x=>Number(x)||0,M=x=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(x||0),C=x=>x>0?'up':x<0?'down':'zero',S=x=>(x>0?'+':'')+M(x),E=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let D=JSON.parse(localStorage.getItem(K)||'{"stocks":[]}'),pick,type;const store=()=>localStorage.setItem(K,JSON.stringify(D)),id=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),now=()=>{let d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return{date:z.toISOString().slice(0,10),time:d.toTimeString().slice(0,5)}};
function calc(s){let lots=[],r=0,rows=[];for(let t of [...s.trades].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))){if(t.type==='buy'){lots.push({q:t.quantity,p:t.price,f:t.fee});rows.push({...t,pnl:null})}else{let left=t.quantity,cost=0;for(let l of lots){let u=Math.min(left,l.q);if(!u)continue;cost+=u*l.p+l.f*u/l.q;l.f-=l.f*u/l.q;l.q-=u;left-=u}let pnl=t.price*t.quantity-t.fee-cost;r+=pnl;rows.push({...t,pnl})}}lots=lots.filter(x=>x.q);let q=lots.reduce((a,x)=>a+x.q,0),cost=lots.reduce((a,x)=>a+x.q*x.p+x.f,0),u=q?(s.current*q-cost):0;return{q,cost,avg:q?cost/q:0,r,u,total:r+u,rows:rows.reverse()}}
function render(){let t=0,r=0,u=0,a=D.stocks.filter(s=>calc(s).q);$('#stocks').innerHTML=a.map(s=>{let x=calc(s);t+=x.total;r+=x.r;u+=x.u;return `<article class="stock" data-id="${s.id}"><div class="stocktop"><div><div class="name">${E(s.name)}</div><div class="qty">持仓 ${x.q} 股</div></div><div class="pricebox" data-input><label>当前价（手动）</label><input type="number" step=".01" value="${s.current||''}" placeholder="未填写" data-price="${s.id}"></div></div><div class="stockdata"><div><span>持仓均价</span><b>${M(x.avg)}</b></div><div><span>未实现盈亏</span><b class="${C(x.u)}">${S(x.u)}</b></div><div><span>总盈亏</span><b class="${C(x.total)}">${S(x.total)}</b></div></div></article>`}).join('')||'<div class="empty">还没有持仓<br><small>点右上角“首次买入”开始记录</small></div>';for(let [i,v] of [['total',t],['realized',r],['unrealized',u]]){$('#'+i).textContent=S(v);$('#'+i).className=i==='total'?'big '+C(v):C(v)}$('#count').textContent=a.length+' 只';document.querySelectorAll('.stock').forEach(e=>e.onclick=()=>detail(e.dataset.id));document.querySelectorAll('[data-price]').forEach(e=>{e.onclick=x=>x.stopPropagation();e.onchange=()=>{D.stocks.find(s=>s.id===e.dataset.price).current=N(e.value);store();render()}})}
function show(x){$('#'+x).classList.add('show')}function close(x){$('#'+x).classList.remove('show')}function dates(f){let d=now();f.querySelector('[name="date"]').value=d.date;f.querySelector('[name="time"]').value=d.time;f.querySelector('[name="date"]').closest('.two').style.display='none'}function fees(f,out){$(out).textContent=M(N(f.querySelector('[name="price"]').value)*N(f.querySelector('[name="quantity"]').value)*.0001)}
function detail(i){pick=i;let s=D.stocks.find(x=>x.id===i),x=calc(s);$('#dName').textContent=s.name;$('#dQty').textContent=`持仓 ${x.q} 股 · 均价 ${M(x.avg)} · 当前价 ${s.current?M(s.current):'未填写'}`;for(let [i,v] of [['dTotal',x.total],['dReal',x.r],['dUnreal',x.u]]){$('#'+i).textContent=S(v);$('#'+i).className=C(v)}$('#sell').disabled=!x.q;$('#list').innerHTML=x.rows.map(t=>`<div class="trade"><div class="dir ${t.type==='buy'?'down':'up'}">${t.type==='buy'?'买入':'卖出'}<small>${t.date} ${t.time}</small></div><div class="trademid">${t.quantity} 股 × ${M(t.price)}<small>金额 ${M(t.quantity*t.price)} · 费用 ${M(t.fee)}</small></div><div class="amount ${t.pnl===null?'zero':C(t.pnl)}">${t.pnl===null?'开仓':S(t.pnl)}<small>${t.pnl===null?'':'已实现盈亏'}</small></div></div>`).join('')||'<div class="empty">暂无交易</div>';show('detailM')}
function trade(k){type=k;let s=D.stocks.find(x=>x.id===pick),x=calc(s),f=$('#tradeF');f.reset();dates(f);if(k==='sell'){let q=f.querySelector('[name="quantity"]');q.max=x.q;q.value=x.q}$('#tradeTitle').textContent=(k==='buy'?'买入 ':'卖出 ')+s.name;$('#tradeHint').textContent=k==='buy'?'本次买入会自动加入该股票持仓。':`最多可卖 ${x.q} 股，卖出盈亏按先进先出计算。`;$('#qLabel').firstChild.textContent=k==='sell'?`数量（最多 ${x.q}）`:'数量';$('#saveTrade').textContent=k==='buy'?'保存买入':'保存卖出';fees(f,'#tradeFee');close('detailM');show('tradeM')}
$('#new').onclick=()=>{let f=$('#newF');f.reset();f.querySelector('[name="quantity"]').value=100;dates(f);fees(f,'#newFee');show('newM')};$('#buy').onclick=()=>trade('buy');$('#sell').onclick=()=>trade('sell');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>e.target===m&&close(m.id));for(let n of ['price','quantity']){$('#newF').querySelector('[name="'+n+'"]').oninput=()=>fees($('#newF'),'#newFee');$('#tradeF').querySelector('[name="'+n+'"]').oninput=()=>fees($('#tradeF'),'#tradeFee')}
function saveFirst(e){e.preventDefault();let form=e.currentTarget;if(!form.reportValidity())return;try{let f=new FormData(form),p=N(f.get('price')),q=N(f.get('quantity')),at=now();D.stocks.push({id:id(),name:f.get('name').trim(),current:p,trades:[{id:id(),type:'buy',price:p,quantity:q,fee:p*q*.0001,date:at.date,time:at.time}]});store();close('newM');render()}catch(err){console.error(err);alert('保存失败：'+(err.message||'浏览器数据不可用'))}}$('#newF').onsubmit=saveFirst;$('#tradeF').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),s=D.stocks.find(x=>x.id===pick),x=calc(s),p=N(f.get('price')),q=N(f.get('quantity')),at=now();if(type==='sell'&&q>x.q)return alert('卖出数量不能超过当前持仓。');s.trades.push({id:id(),type,price:p,quantity:q,fee:p*q*.0001,date:at.date,time:at.time});store();close('tradeM');render();detail(s.id)};render();
</script></body></html>
