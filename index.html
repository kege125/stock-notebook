<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123f2d">
  <title>股票交易记录</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#15221b;background:#f4f7f4}*{box-sizing:border-box}body{margin:0;background:#f4f7f4}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(42px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 18px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#61736a;font-weight:700}.top h1{font-size:25px;margin:4px 0 0}.bag{height:44px;width:44px;border-radius:15px;background:#dceee2;display:grid;place-items:center;font-size:22px}.summary{color:#fff;background:#123f2d;border-radius:25px;padding:20px;box-shadow:0 14px 28px #123f2d28}.muted{font-size:13px;color:#bad5c3}.total{font-size:31px;font-weight:800;margin:5px 0 20px}.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ffffff30;padding-top:14px;gap:14px}.stats strong{display:block;margin-top:5px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:15px 0 28px}.btn{border:0;border-radius:16px;min-height:54px;font-weight:700;font-size:16px}.buy{color:#fff;background:#21724b}.sell{color:#1b6241;background:#fff;border:1px solid #bdd8c5}.btn:disabled{opacity:.45}.section{margin-top:25px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section h2{font-size:18px;margin:0}.count{font-size:12px;background:#e2efe6;color:#37664c;border-radius:99px;padding:5px 9px}.card,.empty{background:#fff;border-radius:20px;padding:15px;margin:9px 0;box-shadow:0 2px 9px #17261d0b}.empty{text-align:center;color:#6b7b71;padding:28px 16px}.empty small{display:block;margin-top:7px}.row{display:flex;justify-content:space-between;gap:10px}.name{font-size:16px;font-weight:750}.code,.sub{font-size:12px;color:#6c7c72;margin-top:5px}.pill{font-size:12px;color:#216d47;background:#e5f3e9;border-radius:8px;padding:5px 7px;height:max-content}.fields{display:grid;grid-template-columns:repeat(3,1fr);margin-top:15px;padding-top:12px;border-top:1px solid #edf1ee;gap:8px}.fields label,.form label{font-size:12px;color:#718077}.fields b{display:block;color:#17221c;margin-top:5px;font-size:14px}.profit{font-weight:800;font-size:17px}.positive{color:#17723f}.negative{color:#bd4e38}.modal{position:fixed;inset:0;background:#0a211355;display:none;align-items:end;z-index:3}.modal.show{display:flex}.sheet{background:#fff;border-radius:25px 25px 0 0;width:100%;max-width:680px;margin:auto;padding:21px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}.sheet h3{font-size:20px;margin:0 0 4px}.hint{font-size:13px;color:#6e7e74;margin:0 0 16px}.form{display:grid;gap:12px}.form .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form label{display:grid;gap:5px;font-weight:600}.form input,.form select,.form textarea{width:100%;min-height:43px;border:1px solid #cbdacf;border-radius:10px;padding:8px 10px;color:#18231c;background:#fff;font-size:16px}.form textarea{min-height:65px;resize:vertical}.fee{display:flex;justify-content:space-between;background:#edf7f0;border-radius:11px;padding:11px;font-size:13px;color:#4d6758}.fee strong{color:#187044}.modal-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:17px}.cancel{background:#f0f3f1;color:#44554a}.save{background:#21724b;color:#fff}.footer{color:#718078;text-align:center;font-size:12px;margin-top:28px;line-height:1.6}@media(max-width:370px){.fields{grid-template-columns:1fr 1fr}.fields div:last-child{grid-column:span 2}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div><div class="eyebrow">MY STOCK NOTE</div><h1>股票交易记录</h1></div><div class="bag">▣</div></header>
  <section class="summary"><div class="muted">已实现累计盈亏</div><div id="totalProfit" class="total">¥0.00</div><div class="stats"><div><div class="muted">已完成交易</div><strong id="tradeCount">0 笔</strong></div><div><div class="muted">持仓成本</div><strong id="holdingCost">¥0.00</strong></div></div></section>
  <section class="buttons"><button class="btn buy" id="buyButton">＋ 记录买入</button><button class="btn sell" id="sellButton">↗ 记录卖出</button></section>
  <section class="section"><div class="section-head"><h2>当前持仓</h2><span id="holdingCount" class="count">0 只</span></div><div id="holdings"></div></section>
  <section class="section"><div class="section-head"><h2>最近完成</h2><span class="sub">单笔自动计算</span></div><div id="history"></div></section>
  <p class="footer">记录保存在这台手机的浏览器中。<br>手续费按每次成交金额的万分之一自动计算。</p>
</main>
<div id="buyModal" class="modal"><section class="sheet"><h3>记录买入</h3><p class="hint">日期和时间已自动填入，可修改为补录时间。</p><form id="buyForm" class="form"><div class="grid"><label>股票代码<input name="code" required placeholder="如 600519" inputmode="numeric"></label><label>股票名称（可选）<input name="name" placeholder="如 贵州茅台"></label></div><div class="grid"><label>买入价格<input name="price" required type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label><label>买入数量<input name="quantity" required type="number" min="1" step="1" inputmode="numeric" value="100"></label></div><div class="grid"><label>日期<input name="date" required type="date"></label><label>时间<input name="time" required type="time"></label></div><div class="fee"><span>手续费（万分之一）</span><strong id="buyFee">¥0.00</strong></div><label>备注（可选）<textarea name="note" placeholder="例如：买入理由"></textarea></label><div class="modal-actions"><button type="button" class="btn cancel" data-close="buyModal">取消</button><button class="btn save">保存买入记录</button></div></form></section></div>
<div id="sellModal" class="modal"><section class="sheet"><h3>记录卖出</h3><p class="hint">卖出后会扣减对应持仓，并计算本次已实现盈亏。</p><form id="sellForm" class="form"><label>选择持仓<select name="holdingId" id="holdingSelect" required></select></label><div class="grid"><label>卖出价格<input name="price" required type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label><label id="sellQtyLabel">卖出数量<input name="quantity" required type="number" min="1" step="1" inputmode="numeric"></label></div><div class="grid"><label>日期<input name="date" required type="date"></label><label>时间<input name="time" required type="time"></label></div><div class="fee"><span>手续费（万分之一）</span><strong id="sellFee">¥0.00</strong></div><div class="modal-actions"><button type="button" class="btn cancel" data-close="sellModal">取消</button><button class="btn save">保存并计算盈亏</button></div></form></section></div>
<script>
  const key='stock-notebook-v2'; let data=JSON.parse(localStorage.getItem(key)||'{"holdings":[],"history":[]}');
  const money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',minimumFractionDigits:2}).format(n||0);
  const now=()=>{const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return {date:d.toISOString().slice(0,10),time:d.toTimeString().slice(0,5)}};
  const save=()=>localStorage.setItem(key,JSON.stringify(data)); const id=()=>crypto.randomUUID?.()||Date.now()+Math.random();
  function render(){const total=data.history.reduce((s,x)=>s+x.profit,0),cost=data.holdings.reduce((s,x)=>s+x.price*x.quantity+x.fee,0); const p=document.querySelector('#totalProfit');p.textContent=(total>0?'+':'')+money(total);p.className='total '+(total<0?'negative':total>0?'positive':'');document.querySelector('#tradeCount').textContent=data.history.length+' 笔';document.querySelector('#holdingCost').textContent=money(cost);document.querySelector('#holdingCount').textContent=data.holdings.length+' 只';document.querySelector('#sellButton').disabled=!data.holdings.length;
    document.querySelector('#holdings').innerHTML=data.holdings.length?data.holdings.map(x=>`<article class="card"><div class="row"><div><div class="name">${esc(x.name)} <span class="code">${esc(x.code)}</span></div><div class="sub">买入于 ${x.date} ${x.time}</div></div><span class="pill">持有中</span></div><div class="fields"><div><label>买入价</label><b>¥ ${x.price.toFixed(2)}</b></div><div><label>数量</label><b>${x.quantity} 股</b></div><div><label>成本</label><b>${money(x.price*x.quantity+x.fee)}</b></div></div></article>`).join(''):'<div class="empty">还没有持仓记录<small>点击上方“记录买入”开始</small></div>';
    document.querySelector('#history').innerHTML=data.history.length?data.history.slice(0,20).map(x=>`<article class="card row"><div><div class="name">${esc(x.name)} <span class="code">${esc(x.code)}</span></div><div class="sub">${x.sellDate} ${x.sellTime} · ${x.quantity} 股</div></div><div class="profit ${x.profit>=0?'positive':'negative'}">${x.profit>0?'+':''}${money(x.profit)}</div></article>`).join(''):'<div class="empty">卖出后，单笔盈亏会出现在这里。</div>';
  }
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function show(which){const dt=now(),form=document.querySelector('#'+which+'Form');form.reset();form.date.value=dt.date;form.time.value=dt.time;if(which==='buy'){form.quantity.value=100}else{const sel=document.querySelector('#holdingSelect');sel.innerHTML=data.holdings.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.code)}（${x.quantity} 股）</option>`).join('');setSellMax();}document.querySelector('#'+which+'Modal').classList.add('show');updateFee(which)}
  function close(which){document.querySelector('#'+which+'Modal').classList.remove('show')}
  function updateFee(which){const f=document.querySelector('#'+which+'Form'),fee=(Number(f.price.value)||0)*(Number(f.quantity.value)||0)*.0001;document.querySelector('#'+which+'Fee').textContent=money(fee)}
  function setSellMax(){const h=data.holdings.find(x=>x.id===document.querySelector('#holdingSelect').value);const q=document.querySelector('#sellForm').quantity;if(h){q.max=h.quantity;q.value=h.quantity;document.querySelector('#sellQtyLabel').firstChild.textContent='卖出数量（最多 '+h.quantity+'）'}}
  document.querySelector('#buyButton').onclick=()=>show('buy');document.querySelector('#sellButton').onclick=()=>show('sell');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close.replace('Modal','')));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show')});
  ['buy','sell'].forEach(w=>['price','quantity'].forEach(n=>document.querySelector('#'+w+'Form [name='+n+']').oninput=()=>updateFee(w)));document.querySelector('#holdingSelect').onchange=setSellMax);
  document.querySelector('#buyForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),price=Number(f.get('price')),quantity=Number(f.get('quantity'));data.holdings.unshift({id:id(),code:String(f.get('code')).trim().toUpperCase(),name:String(f.get('name')).trim()||String(f.get('code')).trim().toUpperCase(),price,quantity,fee:price*quantity*.0001,date:f.get('date'),time:f.get('time'),note:String(f.get('note')).trim()});save();close('buy');render()};
  document.querySelector('#sellForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),h=data.holdings.find(x=>x.id===f.get('holdingId')),price=Number(f.get('price')),quantity=Number(f.get('quantity'));if(!h||quantity>h.quantity){alert('卖出数量不能超过持仓数量。');return}const buyFee=h.fee*quantity/h.quantity,sellFee=price*quantity*.0001;data.history.unshift({...h,quantity,fee:buyFee,sellPrice:price,sellFee,sellDate:f.get('date'),sellTime:f.get('time'),profit:(price-h.price)*quantity-buyFee-sellFee});if(quantity===h.quantity)data.holdings=data.holdings.filter(x=>x.id!==h.id);else{h.quantity-=quantity;h.fee-=buyFee}save();close('sell');render()};render();
</script>
</body>
</html>
